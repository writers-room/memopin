<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모핀</title>
    <script>
      // 첫 페인트 전에 테마를 정한다. 메모함·설정 창만 해당하고, 메모 창은 메모 색이 곧 테마라 무시한다.
      (function () {
        try {
          var t = localStorage.getItem('memopin.theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
